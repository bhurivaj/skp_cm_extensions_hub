<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>SKP CM Extensions Hub</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Tahoma, sans-serif; margin: 0; padding: 16px; background: #f4f4f5; color: #222; font-size: 13px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  h1 { font-size: 16px; margin: 0; }
  #message { display: none; padding: 8px 10px; border-radius: 4px; margin-bottom: 12px; white-space: pre-wrap; }
  #message.info { display: block; background: #e6f4ea; }
  #message.error { display: block; background: #fdecea; color: #8a1c14; }
  .card { background: #fff; border-radius: 6px; padding: 12px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .name { font-weight: 600; font-size: 14px; }
  .desc, .author, .ver { color: #555; margin-top: 4px; }
  .toolbar { display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin-bottom: 8px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #eee; white-space: nowrap; }
  .badge.update_available { background: #fff3cd; }
  .badge.up_to_date { background: #e6f4ea; }
  .err { color: #b3261e; margin-top: 4px; }
  .state { color: #555; margin-top: 4px; }
  .actions { margin-top: 8px; display: flex; gap: 6px; align-items: center; }
  button { padding: 4px 12px; cursor: pointer; }
  button:disabled { cursor: default; opacity: .5; }
  .link { color: #1a73e8; cursor: pointer; margin-left: auto; }
  .notes { display: none; white-space: pre-wrap; background: #fafafa; border: 1px solid #eee; padding: 8px; margin-top: 8px; max-height: 220px; overflow: auto; }
  .notes.open { display: block; }
  #account input { padding: 4px 6px; }
  #account details { margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1 id="title">SKP CM Extensions Hub</h1>
  <button id="refresh">รีเฟรช</button>
</header>
<div id="message"></div>
<div id="account" class="card">กำลังโหลดบัญชี…</div>
<div class="toolbar">
  <label for="sort">เรียงตาม:</label>
  <select id="sort">
    <option value="name">ชื่อ</option>
    <option value="author">ผู้พัฒนา</option>
    <option value="status">สถานะ</option>
  </select>
</div>
<div id="list">กำลังโหลด…</div>

<script>
  var STATUS_TEXT = { not_installed: 'ยังไม่ติดตั้ง', update_available: 'มีอัปเดต', up_to_date: 'ล่าสุดแล้ว', unknown: 'ไม่ทราบสถานะ' };
  var STATUS_ORDER = ['update_available', 'up_to_date', 'unknown', 'not_installed'];
  var currentEntries = [];

  function byText(a, b) {
    return String(a || '').localeCompare(String(b || ''), undefined, { sensitivity: 'base' });
  }

  function statusRank(e) {
    var i = STATUS_ORDER.indexOf(e.status);
    return i < 0 ? STATUS_ORDER.length : i;
  }

  // ties always fall back to the plugin name
  function sortEntries(entries, key) {
    return entries.slice().sort(function (a, b) {
      var primary = 0;
      // plugins without an author go last
      if (key === 'author') primary = (!a.author - !b.author) || byText(a.author, b.author);
      if (key === 'status') primary = statusRank(a) - statusRank(b);
      return primary || byText(a.name, b.name);
    });
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function callRuby(name, arg) {
    try {
      if (arg === undefined) { sketchup[name](); } else { sketchup[name](arg); }
    } catch (e) {
      hub.message('เรียก SketchUp ไม่ได้: ' + e.message, 'error');
    }
  }

  function buttonsFor(e) {
    if (e.pending_restart) return '';
    var html = '';
    if (e.status === 'not_installed') {
      html += '<button data-action="install"' + (e.asset_url ? '' : ' disabled') + '>ติดตั้ง</button>';
    }
    if (e.status === 'update_available') {
      html += '<button data-action="install"' + (e.asset_url ? '' : ' disabled') + '>อัปเดต</button>';
    }
    if (e.installed && !e.self) {
      // Guard against accidental removal: "ถอน" only appears after the plugin is disabled.
      // enabled === null means SketchUp does not know the extension — it can only be removed.
      if (e.enabled === true) html += '<button data-action="disable">ปิดใช้งาน</button>';
      if (e.enabled === false) html += '<button data-action="enable">เปิดใช้งาน</button>';
      if (e.enabled !== true) html += '<button data-action="remove">ถอน</button>';
    }
    return html;
  }

  function cardHtml(e) {
    var ver = (e.installed ? 'ติดตั้งอยู่: ' + esc(e.installed_version || '?') : 'ยังไม่ติดตั้ง') +
              ' · ล่าสุด: ' + esc(e.latest_version || '-');
    var state = e.pending_restart ? 'รอ restart SketchUp' : '';
    var notes = e.notes ? '<span class="link" data-action="notes">release notes</span>' : '';
    return '<div class="card" data-id="' + esc(e.id) + '">' +
      '<div class="row"><span class="name">' + esc(e.name) + '</span>' +
      '<span class="badge ' + esc(e.status) + '">' + esc(STATUS_TEXT[e.status] || e.status) + '</span></div>' +
      '<div class="desc">' + esc(e.description) + '</div>' +
      '<div class="author">โดย: ' + esc(e.author || '-') + '</div>' +
      '<div class="ver">' + ver + '</div>' +
      (e.error ? '<div class="err">' + esc(e.error) + '</div>' : '') +
      '<div class="state">' + state + '</div>' +
      '<div class="actions">' + buttonsFor(e) + notes + '</div>' +
      (e.notes ? '<div class="notes">' + esc(e.notes) + '</div>' : '') +
      '</div>';
  }

  function val(id) {
    var el = document.getElementById(id);
    return el ? el.value : '';
  }

  function accountHtml(a) {
    var settings = '<details><summary>ตั้งค่าบัญชี</summary><div class="actions">' +
      'API Base URL: <input id="auth-url" size="32" value="' + esc(a.api_base_url) + '">' +
      '<button data-auth="save_api_url">บันทึก</button></div></details>';
    if (a.logged_in) {
      return '<div class="row"><span class="name">🔒 ' + esc(a.username) +
        (a.online ? '' : ' <span class="badge">ออฟไลน์</span>') + '</span>' +
        '<button data-auth="logout">Logout</button></div>' + settings;
    }
    return '<div class="name">บัญชี — login เพื่อปลดล็อคฟีเจอร์พิเศษ</div>' +
      '<div class="actions">' +
      '<input id="auth-user" placeholder="Email/Username" value="' + esc(a.username) + '">' +
      '<input id="auth-pass" type="password" placeholder="Password">' +
      '<button data-auth="login"' + (a.busy ? ' disabled' : '') + '>' +
      (a.busy ? 'กำลัง login…' : 'Login') + '</button></div>' + settings;
  }

  var hub = {
    loading: function () {
      document.getElementById('list').textContent = 'กำลังโหลด…';
    },
    render: function (entries) {
      currentEntries = entries;
      var sorted = sortEntries(entries, document.getElementById('sort').value);
      var list = document.getElementById('list');
      list.innerHTML = sorted.length ? sorted.map(cardHtml).join('') : 'ไม่มีรายการ plugin';
    },
    busy: function (id, text) {
      var card = document.querySelector('.card[data-id="' + id + '"]');
      if (!card) return;
      card.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
      card.querySelector('.state').textContent = text;
    },
    message: function (text, kind) {
      var m = document.getElementById('message');
      m.className = text ? kind : '';
      m.textContent = text || '';
    },
    title: function (text) {
      document.getElementById('title').textContent = text;
    },
    auth: function (a) {
      document.getElementById('account').innerHTML = accountHtml(a);
    }
  };

  document.getElementById('list').addEventListener('click', function (ev) {
    var action = ev.target.getAttribute('data-action');
    if (!action || ev.target.disabled) return;
    var card = ev.target.closest('.card');
    var id = card.getAttribute('data-id');
    if (action === 'notes') {
      card.querySelector('.notes').classList.toggle('open');
    } else {
      hub.message('', '');
      callRuby(action, id);
    }
  });

  document.getElementById('sort').addEventListener('change', function () {
    hub.render(currentEntries);
  });

  document.getElementById('refresh').addEventListener('click', function () {
    hub.message('', '');
    callRuby('refresh');
  });

  document.getElementById('account').addEventListener('click', function (ev) {
    var action = ev.target.getAttribute('data-auth');
    if (!action || ev.target.disabled) return;
    hub.message('', '');
    if (action === 'login') {
      ev.target.disabled = true;
      callRuby('login', JSON.stringify({ username: val('auth-user'), password: val('auth-pass') }));
    } else if (action === 'save_api_url') {
      callRuby('save_api_url', val('auth-url'));
    } else {
      callRuby(action);
    }
  });

  document.getElementById('account').addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' || ev.target.id !== 'auth-pass') return;
    var button = document.querySelector('[data-auth="login"]');
    if (button) button.click();
  });

  document.addEventListener('DOMContentLoaded', function () { callRuby('ready'); });
</script>
</body>
</html>
